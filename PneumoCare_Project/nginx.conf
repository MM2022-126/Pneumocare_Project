# nginx.conf - Load Balancer Configuration for PneumoCare
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ========== GZIP COMPRESSION ==========
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    # ========== RATE LIMITING ==========
    # API prediction endpoint: max 2 requests per second per IP
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/s;
    # General API: max 10 requests per second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # ========== UPSTREAM BACKENDS ==========
    upstream pneumocare_backend {
        # Round-robin load balancing
        server backend-1:5000 weight=1 max_fails=3 fail_timeout=30s;
        server backend-2:5000 weight=1 max_fails=3 fail_timeout=30s;
        server backend-3:5000 weight=1 max_fails=3 fail_timeout=30s;

        # Connection pooling
        keepalive 32;
    }

    # ========== SERVER CONFIGURATION ==========
    server {
        listen 80 default_server;
        server_name _;
        client_max_body_size 100M;

        # Health check endpoint
        location /health {
            proxy_pass http://pneumocare_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
            proxy_read_timeout 5s;
            proxy_connect_timeout 5s;
        }

        # Prediction endpoint with rate limiting
        location /predict {
            # Rate limit: 2 requests/second per IP, burst of 5
            limit_req zone=upload_limit burst=5 nodelay;

            proxy_pass http://pneumocare_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Extended timeout for model inference (90 seconds max)
            proxy_connect_timeout 90s;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;

            # Buffer settings for large responses
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # Image serving endpoint
        location /uploads {
            proxy_pass http://pneumocare_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Cache static images for 7 days
            proxy_cache_valid 200 7d;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # All other API endpoints
        location / {
            limit_req zone=api_limit burst=10 nodelay;

            proxy_pass http://pneumocare_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Standard timeout
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Status/stats endpoint (admin only)
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.17.0.0/16;  # Docker network
            deny all;
        }
    }
}
